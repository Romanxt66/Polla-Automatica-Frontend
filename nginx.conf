server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # La app es de una sola página: cualquier ruta que no sea un archivo devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El punto de entrada nunca se cachea, para que las versiones nuevas se vean de inmediato
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
    # Sin hash en el nombre: se revalidan siempre (ETag) para no servir una versión vieja
    location ~ ^/(flutter_bootstrap\.js|main\.dart\.js|main\.dart\.wasm|main\.dart\.mjs|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:js|wasm|css|png|jpg|svg|ico|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
